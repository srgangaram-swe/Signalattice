name: CI

on:
  push:
    branches: [main, prod, dev]
  pull_request:
    branches: [main, prod, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  quality:
    name: Lint, format & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify universal dependency lock
        run: uv lock --check
      - name: Ruff
        run: ruff check --output-format=github src tests scripts
      - name: Black
        run: black --check src tests scripts
      - name: Mypy
        run: mypy src

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: pytest -m "not network"

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests with branch coverage
        run: >-
          pytest -m "not network"
          --cov=quant_platform
          --cov-branch
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=80
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  temporal:
    name: Temporal model (PyTorch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install temporal model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,torch]"
      - name: Exercise the temporal estimator
        run: pytest tests/test_torch_temporal.py

  package:
    name: Build & wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install and inspect the wheel
        run: |
          python -m venv /tmp/signalattice-wheel
          /tmp/signalattice-wheel/bin/python -m pip install --upgrade pip
          /tmp/signalattice-wheel/bin/python -m pip install dist/*.whl
          /tmp/signalattice-wheel/bin/python -m pip check
          /tmp/signalattice-wheel/bin/python -c "from importlib.metadata import version; import quant_platform; assert version('signalattice') == quant_platform.__version__ == '0.2.1'"
          /tmp/signalattice-wheel/bin/signalattice version
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  container:
    name: Build hardened container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --tag signalattice:ci .
      - name: Verify package and non-root runtime
        run: |
          docker run --rm signalattice:ci version
          docker run --rm --entrypoint python signalattice:ci -c "import os; assert os.getuid() == 10001"

  smoke:
    name: End-to-end synthetic smoke test
    runs-on: ubuntu-latest
    needs: [quality, test, coverage, temporal, package, container]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Run full pipeline on synthetic data
        run: signalattice run-full-pipeline --config configs/synthetic.yaml
      - name: Upload generated report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipeline-report
          path: |
            reports/example/**
            reports/*.md
            reports/*.html
            reports/figures/*.png
          if-no-files-found: error
