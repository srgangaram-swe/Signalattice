# Convenience wrapper for running the platform in a container.
#   docker compose build
#   docker compose run --rm platform run-full-pipeline --config configs/synthetic.yaml
services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: signalattice:latest
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SIGNALATTICE_LOG_LEVEL: ${SIGNALATTICE_LOG_LEVEL:-INFO}
      SIGNALATTICE_SEED: ${SIGNALATTICE_SEED:-42}
      SIGNALATTICE_TRACKING_BACKEND: ${SIGNALATTICE_TRACKING_BACKEND:-sqlite}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
    volumes:
      # Persist data, reports, and experiment logs on the host.
      - ./data:/app/data
      - ./reports:/app/reports
      - ./experiments:/app/experiments
      - ./models:/app/models
    tmpfs:
      - /tmp
    # Override the command at runtime, e.g.:
    #   docker compose run --rm platform ingest-data --config configs/example.yaml
    command: ["--help"]
