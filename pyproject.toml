[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-data-platform"
version = "0.1.0"
description = "An end-to-end quantitative research data platform: ingestion, features, factor research, ML, backtesting, risk analytics, and experiment tracking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "srgangaram-swe" }]
keywords = [
    "quant",
    "quantitative-finance",
    "backtesting",
    "factor-research",
    "systematic-trading",
    "machine-learning",
    "time-series",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyarrow>=12.0",
    "matplotlib>=3.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "typer>=0.9",
    "rich>=13.0",
    "tabulate>=0.9",
    "joblib>=1.3",
    "requests>=2.28",
]

[project.optional-dependencies]
# Network data sources (kept optional so CI / offline runs work with synthetic data).
data = [
    "yfinance>=0.2.40",
    "pandas-datareader>=0.10",
]
# Gradient boosting backends. Pure-python install can be slow/unavailable on some
# platforms, so these are opt-in. The code degrades gracefully when absent.
boost = [
    "xgboost>=1.7",
    "lightgbm>=4.0",
]
# Optional deep-learning sequence model.
torch = [
    "torch>=2.0",
]
# Optional richer experiment tracking backend.
mlflow = [
    "mlflow>=2.5",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.5",
    "pre-commit>=3.5",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
quant-platform = "quant_platform.cli:app"

[project.urls]
Homepage = "https://github.com/srgangaram-swe/Quant-Finance-Data-Pipeline-Project"
Repository = "https://github.com/srgangaram-swe/Quant-Finance-Data-Pipeline-Project"
Documentation = "https://github.com/srgangaram-swe/Quant-Finance-Data-Pipeline-Project/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_platform = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
markers = [
    "network: tests that require network access (deselect with '-m \"not network\"')",
    "slow: slow tests",
]

[tool.coverage.run]
branch = true
source = ["quant_platform"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["quant_platform"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
files = ["src"]
