[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "signalattice"
version = "0.2.0"
description = "Calibrated probabilistic market forecasting from point-in-time data to decision-readiness evidence."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "srgangaram-swe" }]
keywords = [
    "quant",
    "quantitative-finance",
    "backtesting",
    "factor-research",
    "systematic-trading",
    "machine-learning",
    "time-series",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=16.0",
    "matplotlib>=3.8",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tabulate>=0.9",
    "joblib>=1.4",
    "Markdown>=3.6",
]

[project.optional-dependencies]
# Network data sources (kept optional so CI / offline runs work with synthetic data).
data = [
    "yfinance>=0.2.40",
    "pandas-datareader>=0.10",
]
# Gradient boosting backends. Pure-python install can be slow/unavailable on some
# platforms, so these are opt-in. A requested backend fails closed when absent.
boost = [
    "xgboost>=1.7",
    "lightgbm>=4.0",
]
# Optional deep-learning sequence model.
torch = [
    "torch>=2.4",
]
# Optional richer experiment tracking backend.
mlflow = [
    "mlflow>=2.5",
]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "black>=26.1",
    "mypy>=2.0",
    "pre-commit>=4.5",
    "build>=1.4",
    "pandas-stubs>=2.2",
    "scikit-learn-stubs>=0.0.3",
    "scipy-stubs>=1.13",
    "types-Markdown>=3.6",
    "types-PyYAML>=6.0.12",
    "types-tabulate>=0.9",
]

[project.scripts]
signalattice = "quant_platform.cli:app"
quant-platform = "quant_platform.cli:app"

[project.urls]
Homepage = "https://github.com/srgangaram-swe/Signalattice"
Repository = "https://github.com/srgangaram-swe/Signalattice"
Documentation = "https://github.com/srgangaram-swe/Signalattice/tree/main/docs"
Issues = "https://github.com/srgangaram-swe/Signalattice/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_platform = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
markers = [
    "network: tests that require network access (deselect with '-m \"not network\"')",
    "slow: slow tests",
]

[tool.coverage.run]
branch = true
source = ["quant_platform"]
# Optional integrations have dedicated CI boundaries: PyTorch runs in the
# temporal job, while live-source adapters are deliberately outside the
# deterministic offline suite.
omit = [
    "src/quant_platform/models/torch_lstm.py",
    "src/quant_platform/data/sources.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["quant_platform"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "joblib",
    "lightgbm",
    "mlflow.*",
    "pandas_datareader.*",
    "pyarrow",
    "pyarrow.*",
    "torch",
    "torch.*",
    "xgboost",
    "yfinance",
]
ignore_missing_imports = true
